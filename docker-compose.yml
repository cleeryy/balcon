services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/balcon.db
      FETCHER_URL: http://fetcher:8000
      ENABLE_FLARESOLVERR: ${ENABLE_FLARESOLVERR:-false}
      FLARESOLVERR_URL: http://flaresolverr:8191
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      CRON_SECRET: ${CRON_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    volumes:
      - balcon-data:/app/data
    depends_on:
      - fetcher
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  fetcher:
    build:
      context: .
      dockerfile: Dockerfile.fetcher

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    profiles: ["flaresolverr"]
    environment:
      LOG_LEVEL: error
    expose:
      - "8191"

volumes:
  balcon-data:
